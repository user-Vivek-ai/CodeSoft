<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 400px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        #status {
            font-size: 1.4rem;
            font-weight: bold;
        }

        #reset-btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #reset-btn:hover {
            background: #ff3742;
            transform: translateY(-3px);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 360px;
            height: 360px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 15px;
        }

        .cell {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            font-size: 4.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .cell:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.03);
        }

        .cell.x { color: #e74c3c; }
        .cell.o { color: #3498db; }

        .controls {
            margin-top: 20px;
            font-size: 1.1rem;
        }

        .controls label {
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .board {
                width: 300px;
                height: 300px;
            }
            .cell {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        <div class="game-info">
            <p id="status">Your turn (X)</p>
            <button id="reset-btn">New Game</button>
        </div>
        
        <div class="board" id="board"></div>

        <div class="controls">
            <label>
                <input type="checkbox" id="ai-first" checked>
                AI goes first (O)
            </label>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const resetBtn = document.getElementById('reset-btn');
        const aiFirstCheckbox = document.getElementById('ai-first');

        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let aiPlayer = 'O';
        let humanPlayer = 'X';

        const winningConditions = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];

        function createBoard() {
            boardElement.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.addEventListener('click', handleCellClick);
                boardElement.appendChild(cell);
            }
        }

        function handleCellClick(e) {
            const index = parseInt(e.target.dataset.index);
            if (board[index] !== '' || !gameActive || currentPlayer !== humanPlayer) return;
            makeMove(index, humanPlayer);
        }

        function makeMove(index, player) {
            board[index] = player;
            const cells = boardElement.children;
            cells[index].textContent = player;
            cells[index].classList.add(player.toLowerCase());

            if (checkWin(player)) {
                statusElement.textContent = player === humanPlayer ? "🎉 You Win!" : "🤖 AI Wins!";
                gameActive = false;
                return;
            }

            if (board.every(cell => cell !== '')) {
                statusElement.textContent = "🤝 It's a Draw!";
                gameActive = false;
                return;
            }

            // Switch player
            currentPlayer = (player === 'X') ? 'O' : 'X';
            
            statusElement.textContent = currentPlayer === humanPlayer ? 
                `Your turn (${humanPlayer})` : `AI thinking...`;

            // Trigger AI move if it's AI's turn
            if (currentPlayer === aiPlayer && gameActive) {
                setTimeout(aiMove, 350);
            }
        }

        function aiMove() {
            if (!gameActive || currentPlayer !== aiPlayer) return;
            const bestMove = minimax(board, aiPlayer).index;
            makeMove(bestMove, aiPlayer);
        }

        function minimax(newBoard, player, alpha = -Infinity, beta = Infinity) {
            const availSpots = newBoard.reduce((acc, val, idx) => 
                val === '' ? acc.concat(idx) : acc, []);

            if (checkWinForBoard(newBoard, humanPlayer)) return { score: -10 };
            if (checkWinForBoard(newBoard, aiPlayer)) return { score: 10 };
            if (availSpots.length === 0) return { score: 0 };

            let bestMove = player === aiPlayer ? {score: -Infinity} : {score: Infinity};

            for (let i of availSpots) {
                newBoard[i] = player;
                const result = minimax(newBoard, player === aiPlayer ? humanPlayer : aiPlayer, alpha, beta);
                newBoard[i] = '';

                if (player === aiPlayer) {
                    if (result.score > bestMove.score) {
                        bestMove.score = result.score;
                        bestMove.index = i;
                    }
                    alpha = Math.max(alpha, result.score);
                } else {
                    if (result.score < bestMove.score) {
                        bestMove.score = result.score;
                        bestMove.index = i;
                    }
                    beta = Math.min(beta, result.score);
                }
                if (beta <= alpha) break;
            }
            return bestMove;
        }

        function checkWinForBoard(boardState, player) {
            return winningConditions.some(condition => 
                condition.every(index => boardState[index] === player)
            );
        }

        function checkWin(player) {
            return checkWinForBoard(board, player);
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            humanPlayer = 'X';
            aiPlayer = 'O';

            createBoard();

            if (aiFirstCheckbox.checked) {
                currentPlayer = aiPlayer;           // AI starts
                statusElement.textContent = "AI thinking...";
                setTimeout(aiMove, 400);
            } else {
                currentPlayer = humanPlayer;        // Human starts
                statusElement.textContent = `Your turn (${humanPlayer})`;
            }
        }

        // Event Listeners
        resetBtn.addEventListener('click', resetGame);
        aiFirstCheckbox.addEventListener('change', resetGame);

        // Start the game
        resetGame();
    </script>
</body>
</html>
