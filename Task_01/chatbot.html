<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RuleBot — AI Chat Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080c14;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.09);
    --border-accent: rgba(99,179,237,0.35);
    --accent: #63b3ed;
    --accent2: #00ffaa;
    --text-primary: #eef2f7;
    --text-secondary: #8899aa;
    --text-muted: #556070;
    --user-bubble: linear-gradient(135deg, #1a4a6e, #1e5f7a);
    --bot-bubble: rgba(255,255,255,0.05);
    --glow: rgba(99,179,237,0.12);
    --font-display: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: var(--font-body);
    color: var(--text-primary);
    overflow: hidden;
  }

  /* Background orbs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 600px; height: 600px;
    top: -200px; right: -150px;
    background: radial-gradient(circle, rgba(99,179,237,0.08) 0%, transparent 70%);
  }
  body::after {
    width: 500px; height: 500px;
    bottom: -180px; left: -120px;
    background: radial-gradient(circle, rgba(118,228,192,0.07) 0%, transparent 70%);
  }

  .page {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 860px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* ── TOP BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    animation: fadeDown 0.5s ease both;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bot-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1a4a6e, #1e6a7a);
    border: 1px solid var(--border-accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 20px var(--glow);
  }
  .brand-text h1 {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }
  .brand-text p {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 300;
  }
  .status-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px;
    border-radius: 20px;
    background: rgba(118,228,192,0.06);
    border: 1px solid rgba(118,228,192,0.2);
    font-size: 12px;
    color: var(--accent2);
    font-weight: 500;
  }
  .status-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent2);
    box-shadow: 0 0 6px var(--accent2);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── MESSAGES ── */
  .messages-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  .messages-wrap::-webkit-scrollbar { width: 4px; }
  .messages-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    animation: msgIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .msg-row.user { flex-direction: row-reverse; }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .avatar.bot-av {
    background: linear-gradient(135deg, #1a4a6e, #1e6a7a);
    border: 1px solid var(--border-accent);
  }
  .avatar.user-av {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
  }

  .bubble-wrap { display: flex; flex-direction: column; max-width: 72%; }
  .msg-row.user .bubble-wrap { align-items: flex-end; }

  .bubble {
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.65;
    font-weight: 400;
    word-break: break-word;
    white-space: pre-line;
  }
  .bubble.bot {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
    color: var(--text-primary);
  }
  .bubble.user {
    background: var(--user-bubble);
    border: 1px solid var(--border-accent);
    border-bottom-right-radius: 5px;
    color: #dceefa;
  }

  .msg-time {
    font-size: 10.5px;
    color: var(--text-muted);
    margin-top: 4px;
    padding: 0 2px;
    font-weight: 300;
  }

  /* typing dots */
  .typing-bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
    padding: 13px 16px;
    border-radius: 16px;
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: dotBounce 1.3s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.18s; }
  .dot:nth-child(3) { animation-delay: 0.36s; }
  @keyframes dotBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px);background:var(--accent)} }

  /* ── CHIPS ── */
  .chips-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 10px 0 8px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    animation: fadeUp 0.5s 0.2s ease both;
  }
  .chip {
    padding: 6px 13px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 12.5px;
    font-family: var(--font-body);
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .chip:hover {
    background: var(--surface-hover);
    border-color: var(--border-accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  /* ── INPUT BAR ── */
  .input-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0 20px;
    flex-shrink: 0;
    animation: fadeUp 0.5s 0.3s ease both;
  }
  .input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrap:focus-within {
    border-color: var(--border-accent);
    box-shadow: 0 0 0 3px var(--glow);
  }
  #userInput {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    padding: 13px 0;
    font-size: 14.5px;
    font-family: var(--font-body);
    color: var(--text-primary);
    font-weight: 400;
  }
  #userInput::placeholder { color: var(--text-muted); }
  .send-btn {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1a4a6e, #1e6a7a);
    border: 1px solid var(--border-accent);
    color: var(--accent);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    transition: all 0.18s;
    box-shadow: 0 0 16px var(--glow);
  }
  .send-btn:hover { transform: scale(1.06); box-shadow: 0 0 24px rgba(99,179,237,0.25); }
  .send-btn:active { transform: scale(0.96); }

  /* ── WELCOME CARD ── */
  .welcome-card {
    margin: auto;
    text-align: center;
    padding: 32px 24px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    max-width: 420px;
    animation: fadeIn 0.6s ease both;
  }
  .welcome-card .big-icon { font-size: 42px; margin-bottom: 16px; }
  .welcome-card h2 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--text-primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .welcome-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.7; font-weight: 300; }
  .welcome-card .caps {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 18px;
  }
  .cap-tag {
    padding: 5px 11px;
    border-radius: 8px;
    background: rgba(99,179,237,0.07);
    border: 1px solid rgba(99,179,237,0.18);
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
  }

  @keyframes fadeDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeUp   { from{opacity:0;transform:translateY(10px)}  to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn   { from{opacity:0;transform:scale(0.97)}        to{opacity:1;transform:scale(1)} }
</style>
</head>
<body>

<div class="page">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">
      <div class="bot-icon">🤖</div>
      <div class="brand-text">
        <h1>RuleBot</h1>
        <p>Rule-Based Chat Assistant</p>
      </div>
    </div>
    <div class="status-badge">Online</div>
  </div>

  <!-- MESSAGES -->
  <div class="messages-wrap" id="messages">
    <div class="welcome-card" id="welcomeCard">
      <div class="big-icon">🤖</div>
      <h2>Hi, I'm RuleBot</h2>
      <p>A smart rule-based chatbot that understands your queries using pattern matching. Ask me anything below!</p>
      <div class="caps">
        <span class="cap-tag">👋 Greetings</span>
        <span class="cap-tag">😄 Jokes</span>
        <span class="cap-tag">🌤 Weather</span>
        <span class="cap-tag">🕐 Time & Date</span>
        <span class="cap-tag">❓ Help</span>
      </div>
    </div>
  </div>

  <!-- QUICK CHIPS -->
  <div class="chips-bar" id="chips">
    <button class="chip" onclick="sendChip('Hello!')">👋 Hello</button>
    <button class="chip" onclick="sendChip('Tell me a joke')">😄 Tell a joke</button>
    <button class="chip" onclick="sendChip('What is the weather?')">🌤 Weather</button>
    <button class="chip" onclick="sendChip('What time is it?')">🕐 Time</button>
    <button class="chip" onclick="sendChip('What is today\'s date?')">📅 Date</button>
    <button class="chip" onclick="sendChip('Help')">❓ Help</button>
  </div>

  <!-- INPUT BAR -->
  <div class="input-bar">
    <div class="input-wrap">
      <input id="userInput" type="text" placeholder="Type a message…" autocomplete="off" />
    </div>
    <button class="send-btn" id="sendBtn" title="Send">➤</button>
  </div>

</div>

<script>
const RULES = [
  { re: /\b(hi|hello|hey|howdy|greetings|sup)\b/i,
    res: ["Hello there! 😊 How can I help you today?","Hey! Great to see you. What can I do for you?","Hi! I'm RuleBot, ready to help."] },
  { re: /\b(bye|goodbye|see you|cya|farewell|later)\b/i,
    res: ["Goodbye! Have a wonderful day! 👋","See you later! Take care! 😊","Bye! Come back anytime!"] },
  { re: /\b(your name|who are you|what are you)\b/i,
    res: ["I'm RuleBot — a rule-based chatbot built with pattern matching! 🤖","My name is RuleBot! I respond based on predefined rules."] },
  { re: /\b(how are you|how do you do|are you okay|you good)\b/i,
    res: ["I'm just a bot, but I'm running great! Thanks for asking 😄","All systems operational! How about you?"] },
  { re: /\b(weather|temperature|forecast|rain|sunny|cloudy)\b/i,
    res: ["I can't check real-time weather, but try weather.com! 🌤","For weather updates, check Google or your local forecast app! ⛅"] },
  { re: /\b(time|clock|what time)\b/i,
    res: [()=>`The current time is ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} 🕐`] },
  { re: /\b(date|today|what day)\b/i,
    res: [()=>`Today is ${new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})} 📅`] },
  { re: /\b(joke|funny|make me laugh|humor)\b/i,
    res: ["Why do programmers prefer dark mode? Because light attracts bugs! 🐛😂","Why did the chatbot go to school? To improve its language skills! 📚😄","I told my computer I needed a break. Now it won't stop sending me vacation ads! 😆"] },
  { re: /\b(help|support|what can you do|features|commands)\b/i,
    res: ["I can help with:\n• 👋 Greetings & small talk\n• 😄 Jokes\n• 🌤 Weather tips\n• 🕐 Time & date\n• ❓ FAQs\n\nJust type naturally!"] },
  { re: /\b(thank|thanks|thank you|thx|ty)\b/i,
    res: ["You're welcome! 😊 Anything else?","Happy to help! 🙌","Anytime! Don't hesitate to ask more."] },
  { re: /\b(age|how old|created|born)\b/i,
    res: ["I was just built for this project! I'm brand new 🎉","I was built with HTML, CSS & JavaScript!"] },
  { re: /\b(python|code|program|script|javascript|html)\b/i,
    res: ["This chatbot is built with HTML, CSS & JS! 💻 Pattern matching powers my responses.","Clean code makes happy bots! 🐍"] },
  { re: /\b(love|like|favorite|best|awesome|cool|great)\b/i,
    res: ["Thanks for the kind words! 💙","I appreciate the positivity! 😊"] },
];

const FALLBACKS = [
  "Hmm, I'm not sure about that. Type 'help' to see what I can do! 🤔",
  "I didn't quite catch that. Could you rephrase?",
  "That's outside my rule set! Type 'help' to see available topics. 🤖",
];

function getReply(text) {
  for (const rule of RULES) {
    if (rule.re.test(text)) {
      const r = rule.res[Math.floor(Math.random() * rule.res.length)];
      return typeof r === 'function' ? r() : r;
    }
  }
  return FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
}

function nowTime() {
  return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function removeWelcome() {
  const w = document.getElementById('welcomeCard');
  if (w) w.remove();
}

function addMessage(text, isUser) {
  removeWelcome();
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row ' + (isUser ? 'user' : 'bot');

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + (isUser ? 'user-av' : 'bot-av');
  avatar.textContent = isUser ? '🧑' : '🤖';

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (isUser ? 'user' : 'bot');
  bubble.textContent = text;

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = nowTime();

  wrap.appendChild(bubble);
  wrap.appendChild(time);
  row.appendChild(avatar);
  row.appendChild(wrap);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  removeWelcome();
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingRow';

  const avatar = document.createElement('div');
  avatar.className = 'avatar bot-av';
  avatar.textContent = '🤖';

  const tb = document.createElement('div');
  tb.className = 'typing-bubble';
  tb.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

  row.appendChild(avatar);
  row.appendChild(tb);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingRow');
  if (t) t.remove();
}

function handleSend() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, true);
  input.value = '';
  showTyping();
  setTimeout(() => {
    removeTyping();
    addMessage(getReply(text), false);
  }, 600 + Math.random() * 500);
}

function sendChip(text) {
  document.getElementById('userInput').value = text;
  handleSend();
}

document.getElementById('sendBtn').addEventListener('click', handleSend);
document.getElementById('userInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') handleSend();
});
</script>
</body>
</html>
